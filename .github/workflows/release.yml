name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Verify and build release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true

      - name: Verify release metadata
        run: |
          uv run --no-project python scripts/check_release_metadata.py \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --expected-tag "$GITHUB_REF_NAME"

      - name: Verify lockfile
        run: uv lock --check

      - name: Run tests
        run: uv run --locked pytest

      - name: Run Ruff checks
        run: uv run --locked ruff check src tests scripts

      - name: Check formatting
        run: uv run --locked ruff format --check src tests scripts

      - name: Run strict mypy
        run: uv run --locked mypy --strict src tests scripts

      - name: Check whitespace errors
        run: git diff --check

      - name: Build distributions
        run: |
          rm -rf dist build
          uv build

      - name: Smoke-test built wheel in a clean environment
        run: |
          uv venv --python 3.13 /tmp/liftassess-release-smoke-wheel
          uv pip install --python /tmp/liftassess-release-smoke-wheel/bin/python dist/*.whl
          /tmp/liftassess-release-smoke-wheel/bin/python scripts/release_smoke.py \
            --expected-version "${GITHUB_REF_NAME#v}"

      - name: Smoke-test source distribution in a clean environment
        run: |
          uv venv --python 3.13 /tmp/liftassess-release-smoke-sdist
          uv pip install --python /tmp/liftassess-release-smoke-sdist/bin/python dist/*.tar.gz
          /tmp/liftassess-release-smoke-sdist/bin/python scripts/release_smoke.py \
            --expected-version "${GITHUB_REF_NAME#v}"

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/liftassess
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease_flag+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --draft \
            "${prerelease_flag[@]}"
