name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Verify and build release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match project version {version!r}; "
                  f"expected {expected_tag!r}"
              )
          print(f"Release tag matches project version: {actual_tag}")
          PY

      - name: Verify lockfile
        run: uv lock --check

      - name: Run tests
        run: uv run --locked pytest

      - name: Run Ruff checks
        run: uv run --locked ruff check src tests scripts

      - name: Check formatting
        run: uv run --locked ruff format --check src tests scripts

      - name: Run strict mypy
        run: uv run --locked mypy --strict src tests scripts

      - name: Check whitespace errors
        run: git diff --check

      - name: Build distributions
        run: |
          rm -rf dist build
          uv build

      - name: Smoke-test built wheel in a clean environment
        run: |
          uv venv --python 3.13 /tmp/liftassess-release-smoke-wheel
          uv pip install --python /tmp/liftassess-release-smoke-wheel/bin/python dist/*.whl
          /tmp/liftassess-release-smoke-wheel/bin/python scripts/release_smoke.py \
            --expected-version "${GITHUB_REF_NAME#v}"

      - name: Smoke-test source distribution in a clean environment
        run: |
          uv venv --python 3.13 /tmp/liftassess-release-smoke-sdist
          uv pip install --python /tmp/liftassess-release-smoke-sdist/bin/python dist/*.tar.gz
          /tmp/liftassess-release-smoke-sdist/bin/python scripts/release_smoke.py \
            --expected-version "${GITHUB_REF_NAME#v}"

      - name: Upload release distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/liftassess
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease_flag+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --draft \
            "${prerelease_flag[@]}"
