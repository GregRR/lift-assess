[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liftassess"
version = "0.0.0"
description = "Evidence-based assessment of ambiguous genomic coordinate liftover candidates"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
