[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liftassess"
version = "0.1.0a1"
description = "Evidence-based assessment of ambiguous genomic coordinate liftOver mappings"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Greg Roe" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "bioinformatics",
    "genomics",
    "liftover",
    "genomic-coordinates",
    "coordinate-conversion",
    "genome-assembly",
    "comparative-genomics",
    "ucsc",
    "provenance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/GregRR/lift-assess"
Documentation = "https://github.com/GregRR/lift-assess/tree/main/docs"
Repository = "https://github.com/GregRR/lift-assess"
Issues = "https://github.com/GregRR/lift-assess/issues"
Releases = "https://github.com/GregRR/lift-assess/releases"

[project.scripts]
assess-liftover = "liftassess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
